<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#202A3C" />
<title>To do</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="To do" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header class="app-header">
    <h1 class="wordmark">To do</h1>
    <p class="today-date" id="todayDate"></p>
  </header>

  <main class="task-scroll">

    <section id="pendingSection" class="pending-section" hidden>
      <p class="section-label">Carried over</p>
      <ul class="task-list" id="pendingList"></ul>
    </section>

    <section id="todaySection" class="today-section">
      <ul class="task-list" id="todayList"></ul>
    </section>

    <p class="empty-state" id="emptyState" hidden>
      Nothing on the list yet.<br />Add what you need to get done today.
    </p>

  </main>

  <form class="add-bar" id="addForm">
    <input
      type="text"
      id="taskInput"
      class="add-input"
      placeholder="Add a task for today"
      autocomplete="off"
      maxlength="140"
    />
    <button type="submit" class="add-btn" aria-label="Add task">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </form>

</div>

<script src="app.js"></script>
</body>
</html>
